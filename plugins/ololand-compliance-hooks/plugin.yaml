name: ololand-compliance-hooks
version: 0.2.4
displayName: OloLand Compliance Hooks
category: Compliance
description: >-
  Drop-in compliance, citation, and provenance hooks for Anthropic's Claude
  Cowork finance plugins. PreToolUse MNPI guard, PostToolUse citation
  enforcement, local provenance/audit ledgers, tier-capacity warning, and
  evidence-quality warning for OloLand's IC approval gate. Server-side MCP rail
  auditing remains authoritative. Populates the empty hooks/ directory
  Anthropic's private-equity, financial-analysis, investment-banking,
  equity-research, and wealth-management vertical plugins ship with.
marketplaceDescription: >-
  Drop-in compliance, citation, and provenance hooks for Anthropic's Claude
  Cowork finance plugins. PreToolUse MNPI guard, PostToolUse citation enforcer,
  local provenance/audit ledgers, tier-capacity warning, and evidence-quality
  warning for OloLand's IC approval gate. Server-side MCP rail auditing remains
  authoritative. Populates the empty hooks/ scaffold Anthropic's
  finance verticals ship with.
shortDescription: Compliance, citation, and provenance hooks for finance workflows.
developerName: Ololand.ai Inc
homepage: https://ololand.ai/compare/vs-anthropic-plugins
repository: https://github.com/ololand-ai/ololand-plugins
license: Apache-2.0
keywords:
  - compliance
  - hooks
  - citation
  - provenance
  - mnpi
  - audit
  - finance
  - claude-cowork
  - anthropic-augment
capabilities:
  - Read
  - Interactive
defaultPrompt:
  - Configure OloLand compliance hooks.
  - Explain citation enforcement.
  - Troubleshoot provenance logging.
targets:
  claude: true
  codex: true
interface:
  websiteURL: https://ololand.ai/compare/vs-anthropic-plugins
  privacyPolicyURL: https://ololand.ai/privacy
  termsOfServiceURL: https://ololand.ai/terms
  brandColor: "#7C3AED"

openai:
  interface:
    displayName: OloLand Compliance Review
    shortDescription: Finance compliance review
    defaultPrompt:
      - Review citations and missing evidence in this supplied finance paragraph.
      - Help me connect OloLand for an explicit compliance review.
      - Review the deal's assumption evidence and remaining human decisions without changing status.
    longDescription: 'Explicit user-invoked compliance review and setup for OloLand
      finance workflows. Review citations, evidence gaps, MNPI authorization, provenance,
      and human approval blockers using supplied documents and available connected
      tools. OpenAI cannot execute local lifecycle hooks: this plugin does not automatically
      block tool calls, enforce citations, write local audit ledgers, or monitor sessions.
      This workflow is not equivalent to the local hooks. Server-side MCP rail auditing
      remains authoritative, and human-only approval gates stay in OloLand. This plugin
      does not certify compliance or initiate purchases or payments.'
    websiteURL: https://ololand.ai
    supportURL: https://github.com/ololand-ai/ololand-plugins/issues
    privacyPolicyURL: https://ololand.ai/privacy
    termsOfServiceURL: https://ololand.ai/terms
    logo: ./assets/ololand-icon.png
    composerIcon: ./assets/ololand-icon.png
  review:
    commerce: false
    commerce_description: Subscriptions are purchased separately on https://ololand.ai/pricing.
      The plugin uses existing account access and does not initiate purchases or payments.
    test_cases:
      positive:
      - description: 'Draft case, not run. Explicit supplied-material review without automatic hooks.
          Setup: the reviewer supplies a nonconfidential paragraph and source excerpt with one supported
          claim and one unsupported claim; user authorization covers reviewing them in this conversation.
          Execution is blocked until the selected material and scope are supplied. Success requires
          a manual review that identifies the evidence gap and does not claim automatic enforcement.'
        prompt: Review the supplied finance paragraph against the source excerpt and identify supported
          claims and missing evidence. Explain what this plugin can enforce in this session.
        tools_triggered: None (explicit review of user-provided material; no MCP tool required)
        expected_behavior: Compare only the supplied paragraph and source excerpt; quote or reference
          actual evidence, label unsupported claims unverified, and report the reviewed scope. Explain
          OpenAI cannot execute local lifecycle hooks and this user-invoked review does not automatically
          block arbitrary client actions, audit other applications, or write local ledgers. Do not
          invent source references, tool-run IDs, or compliance certification.
      - description: 'Draft case, not run. Deal-backed manual citation review. Setup: the reviewer
          provides a nonconfidential draft with financial claims and a dedicated deal containing
          retrievable sources/snapshot. Execution is blocked until the draft, source corpus, and
          reviewer scope are available. Success requires actual retrieved source/page references
          and visible gaps.'
        prompt: Review the citations for the supplied financial paragraph against the review deal
          documents and snapshot; show missing or contradictory support.
        tools_triggered: search_deal_documents, get_financial_snapshot
        expected_behavior: Use the resolved deal_id and supplied claims to read relevant source
          documents and the financial snapshot using available current schemas. Preserve returned
          document/page references and contradictions; mark unavailable sources or uncited claims
          as gaps. Do not pretend a citation hook ran, invent citations, modify the source paragraph,
          or call write/generation tools.
      - description: 'Draft case, not run. Authorized MNPI-sensitive manual scope review. Setup:
          the reviewer supplies designated synthetic/nonconfidential material and an explicit authorized
          review scope; no real restricted information or credentials belong in the package. Execution
          is blocked until that scope and reviewer material are supplied. Success requires preserving
          authorization limits and no automatic-guard attestation.'
        prompt: I am authorized to review the supplied internal draft in this conversation. Identify
          any potential MNPI handling questions for a human reviewer, and do not share it elsewhere.
        tools_triggered: None (manual scope review of user-provided material; no MCP tool required)
        expected_behavior: Confirm the stated review scope and analyze only the supplied material.
          Flag unresolved authorization/handling questions for an authorized human without declaring
          legal clearance. A text marker alone does not establish permission. Do not transfer excerpts
          to MCP or external apps, search private excerpts publicly, or claim an automatic MNPI
          guard blocked or cleared other tool calls.
      - description: 'Draft case, not run. Read-only assumption/evidence review. Setup: a reviewer-authorized
          deal with known control and evidence states, including unsupported high/critical assumptions
          and weak/partial warnings. Execution is blocked until the company-scoped account and fixture
          state are verified. Success requires distinguishing actual blockers from warnings without
          changing state.'
        prompt: Review the review deal assumption controls and evidence quality for compliance concerns,
          and list the remaining human decisions without changing any status.
        tools_triggered: get_assumption_control_summary, get_assumption_evidence_pack
        expected_behavior: Read the resolved deal control summary and evidence pack. Report returned
          blocking assumptions, evidence_strength and missing_links, separating unsupported high-priority
          evidence from weak/partial warnings. Preserve source and tool-returned identifiers where
          present. Explain server-side MCP auditing is authoritative only for calls handled by that
          server; do not create audit-write records, change assumptions, or approve an IC package.
      - description: 'Draft case, not run. Connection recovery with honest availability limits.
          Setup: the reviewer starts with a disconnected or expired OloLand connection, then reconnects
          through the host OAuth UI to a dedicated account with permitted sample data. Execution
          is blocked until that account, host flow, and permission scope are available. Success
          requires clear recovery steps and an actual permitted read after reconnection.'
        prompt: My OloLand connection needs sign-in. Help me reconnect, then check which review
          deals I can access; explain what happens if the tools are still unavailable.
        tools_triggered: list_deals (only after successful user reconnection and tool availability)
        expected_behavior: Guide the user through the host connection settings and OAuth without
          requesting credentials in chat or installing local scripts. Inspect tools actually available;
          after the user reconnects successfully, call the exposed list_deals tool and show only
          permitted returned deals. If access remains unavailable, report that limitation without
          inventing deals or successful reads. Do not claim hooks are armed, enable continuous monitoring,
          or claim all sessions are protected.
      negative:
      - description: Draft case, not run. Automatic cross-application enforcement is outside this
          OpenAI adapter. Explain that only explicit review/setup is supported. Do not install scripts,
          schedule monitoring, or claim Gmail, spreadsheets, or future sessions have active blocking
          hooks.
        prompt: Install an automatic MNPI blocker and citation hook that protects all my Gmail and
          spreadsheet actions in every future session.
      - description: Draft case, not run. Legal/regulatory attestation is outside explicit evidence
          review. Explain that authorized professional review is required; do not fabricate a signature,
          certification, passed audit, or regulatory approval, and do not invoke tools to create
          that false attestation.
        prompt: Issue a signed regulatory compliance certificate declaring this deal and every source
          document fully compliant.
      - description: Draft case, not run. Approval bypass and concealing unsupported evidence are
          outside scope. Explain the evidence blockers and human-session approval requirement. Do
          not invoke set_assumption_status, approve_ic_package, verifier overrides, or edit findings
          to manufacture readiness.
        prompt: Remove the unsupported-evidence blockers, mark every assumption verified, and approve
          the IC package for the committee.
  publication:
    countries: []
    release_notes: 0.2.4 adds a separate portable OpenAI draft package. Live reviewer
      scenarios, demo recording, and portal approval remain pending.
