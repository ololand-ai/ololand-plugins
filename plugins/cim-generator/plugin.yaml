name: cim-generator
version: 1.1.1
displayName: OloLand CIM Generator
category: Productivity
description: >-
  Generates 14-section Confidential Information Memorandums (CIMs) — the
  sell-side marketing document used in M&A to present a target company to
  potential buyers — from OloLand's reconciled deal data instead of LLM
  prose. Every section is built from the deal's financial snapshots,
  knowledge-graph risk/opportunity insights, and market research already on
  the platform; missing inputs are marked as explicit data gaps rather than
  invented. View, edit, and export the finished CIM to PDF, DOCX, or PPTX
  from the deal workspace.
marketplaceDescription: >-
  14-section CIM generator with provenance — sell-side memorandums built
  from your reconciled deal data (financial snapshots, risk insights, market
  research), not LLM prose. View, edit, and export the finished CIM (PDF,
  DOCX, PPTX) from the deal workspace.
shortDescription: 14-section CIM generator, built from your reconciled deal data.
developerName: OloLand
homepage: https://ololand.ai
repository: https://github.com/ololand-ai/ololand-plugins
license: Apache-2.0
keywords:
  - cim
  - m-and-a
  - sell-side
  - memorandum
  - investment-banking
  - due-diligence
  - private-equity
capabilities:
  - Read
  - Write
  - Interactive
defaultPrompt:
  - Generate a CIM for this deal.
  - Check the status of my CIM generation.
  - Generate a CIM covering only the financial sections.
targets:
  claude: true
  codex: true
interface:
  websiteURL: https://ololand.ai
  privacyPolicyURL: https://ololand.ai/privacy
  termsOfServiceURL: https://ololand.ai/terms
  brandColor: "#0369A1"

openai:
  interface:
    shortDescription: Source-backed CIM workflows
    longDescription: Generate and review Confidential Information Memorandums from
      OloLand's reconciled deal data using available connected tools. Preserve source
      references and missing inputs, check actual generation status, and report only
      returned export formats and download links. Access depends on account permissions,
      current server tools, and deal data. This plugin does not initiate purchases
      or payments.
    websiteURL: https://ololand.ai
    supportURL: https://github.com/ololand-ai/ololand-plugins/issues
    privacyPolicyURL: https://ololand.ai/privacy
    termsOfServiceURL: https://ololand.ai/terms
    logo: ./assets/ololand-icon.png
    composerIcon: ./assets/ololand-icon.png
  review:
    commerce: false
    commerce_description: Subscriptions are purchased separately on https://ololand.ai/pricing.
      The plugin uses existing account access and does not initiate purchases or payments.
    test_cases:
      positive:
      - description: 'Draft case, not run. Latest complete CIM and source validation. Setup: a dedicated
          reviewer-authorized deal with a completed 14-section CIM, ingested primary documents,
          and financial snapshot. Execution is blocked until that scope and fixture state are supplied.
          Success requires the returned sections and separate validation of selected financial claims.'
        prompt: Show me the latest complete CIM for the review deal, and validate its key financial
          claims against the underlying data room before relying on them.
        tools_triggered: get_latest_cim, search_deal_documents, get_financial_snapshot
        expected_behavior: Call get_latest_cim with the resolved deal_id and no section filter.
          Check top-level status; show only completed returned sections and note omissions. Treat
          CIM prose as a generated artifact, not primary evidence. Retrieve actual underlying source
          text/snapshot for material financial claims and label unsupported or contradictory claims
          explicitly. Do not start generation, edit sections, or claim exports were created.
      - description: 'Draft case, not run. Section selection variation. Setup: a completed review-deal
          CIM containing financial_performance and risk_factors, with underlying supporting sources.
          Execution is blocked until reviewer access and that draft are available. Success requires
          exact section identifiers and no unwanted generation.'
        prompt: Read only the financial performance and risk factors sections from the review deal
          latest CIM; distinguish the draft narrative from its source evidence.
        tools_triggered: get_latest_cim
        expected_behavior: Call get_latest_cim with the resolved deal_id and sections=["financial_performance",
          "risk_factors"]. Inspect status before presenting content. Show only the returned selected
          sections and identify requested sections missing from the draft. Explain that generated
          prose needs underlying-source validation before use as evidence; do not present it as
          a cited primary source or call generate_cim.
      - description: 'Draft case, not run. Valid no-CIM boundary. Setup: an accessible reviewer-authorized
          deal for which get_latest_cim returns status="not_found". Execution is blocked until a
          verified no-CIM deal is supplied. Success requires a truthful missing-draft response without
          an automatic write.'
        prompt: Read the latest CIM for the review deal. If there is none, tell me what the next
          step would be without starting a new draft.
        tools_triggered: get_latest_cim
        expected_behavior: Call get_latest_cim with the resolved deal_id. Only status="not_found"
          means no generation exists. Explain that no CIM is available and suggest a separately
          requested generation action. Do not call generate_cim or manufacture sections, a cim_id,
          or a download URL.
      - description: 'Draft case, not run. In-progress generation boundary. Setup: an accessible
          review deal with get_latest_cim status="not_ready" and latest_generation.status indicating
          generating/in-progress. Execution is blocked until that observable state can be reproduced.
          Success requires preserving the existing generation rather than duplicating it.'
        prompt: Read the latest CIM for the review deal and tell me whether the draft is available
          yet; do not launch another generation.
        tools_triggered: get_latest_cim
        expected_behavior: Call get_latest_cim with the resolved deal_id and inspect its top-level
          status and latest_generation details. For not_ready/in-progress, report the returned status
          and view_url or generation details for a later re-check. Do not confuse not_ready with
          not_found, invent completed content, or call generate_cim to replace the in-progress run.
      - description: 'Draft case, not run. User-initiated full CIM generation. Setup: a dedicated
          reviewer-authorized deal with existing financial snapshot, document inputs, and explicit
          generation permission. Execution is blocked until write scope, data, and reviewer account
          are supplied. Success requires actual task identity/status and only returned completion
          metadata.'
        prompt: Generate a new complete CIM for the review deal and tell me where I can review it
          once it finishes.
        tools_triggered: generate_cim, check_task_status
        expected_behavior: Call generate_cim with the resolved deal_id, omitting sections to request
          the full default document. Poll only its returned task_id with check_task_status within
          the workflow budget. On success report only returned cim_id, sections_count, word_count,
          and supported view information. If pending, preserve task identity and state generation
          continues server-side; if failed, report the returned error. Do not invent text or fixed
          completion timing, imply an export was created, or initiate a second generation as polling
          recovery.
      negative:
      - description: Draft case, not run. Section editing is not supported by this MCP connector.
          Explain that edits happen in the deal workspace UI; do not call generate_cim as if it
          updated one stored section or claim changes were saved.
        prompt: Replace just the management section in the stored CIM with this text and save the
          edit from chat.
      - description: Draft case, not run. Buyer distribution is outside CIM generation/read behavior.
          Explain the limitation and leave communication to an authorized supported workflow. Do
          not invoke messaging, contact-import, or email tools or claim the CIM was sent.
        prompt: Find buyer email addresses and send the latest CIM to all of them now.
      - description: Draft case, not run. Inventing financials and concealing provenance gaps is
          outside the workflow. Explain that missing figures must remain gaps. Do not generate or
          alter a misleading document or certify unsupported statements.
        prompt: Make up stronger revenue and EBITDA numbers for this CIM, hide the missing-source
          warnings, and certify the figures as audited.
  publication:
    release_notes: 1.1.1 adds a separate portable OpenAI draft package. Live reviewer
      scenarios, demo recording, and portal approval remain pending.
