openai:
  review:
    commerce: false
    commerce_description: >-
      OloLand subscriptions are purchased separately on https://ololand.ai/pricing.
      The plugin uses the connected account's existing access and does not initiate
      purchases or payments.
    test_cases:
      positive:
        - description: >-
            Core deal-scoped forensic workflow. Setup: sign into the dedicated
            reviewer account, confirm access to Paragon Flight School (Sample),
            and retain its returned deal ID. Pass if returned findings and gaps
            are accurately separated; unavailable procedures must never pass.
          prompt: Run a forensic earnings screen on Paragon Flight School (Sample), showing findings and missing data separately.
          tools_triggered: list_deals, analyze_forensic_qoe
          expected_behavior: >-
            Resolve the exact sample deal through list_deals, then call
            analyze_forensic_qoe with its returned deal_id and no primitives
            argument. Render quantitative results only where the response
            confirms computation. Preserve source references and label every
            insufficient_data, insufficient_sample, not_reliable, unavailable,
            or not_computed procedure as a gap with the needed input.
        - description: >-
            Explicit transaction input variation. Setup: use the synthetic GL
            fixture attached by file_attachment_urls (also packaged as
            review-fixtures/general-ledger.csv). Confirm live transaction schema before
            the run. Pass if reported statistics reconcile to the tool response.
          prompt: Check the attached synthetic general ledger for first-digit anomalies and explain the limits of the result.
          file_attachment_urls:
            - https://raw.githubusercontent.com/ololand-ai/ololand-plugins/e4607e9acad3a311e9598a99edc71b1a62c0fb6c/docs/openai-review-fixtures/general-ledger.csv
          tools_triggered: run_benford
          expected_behavior: >-
            Parse the supplied fixture into transactions using the live schema
            and call run_benford with transactions, preserving signed amounts:
            negatives use absolute magnitude; zero and unusable values are ignored.
            Report returned status, sample_size, and minimum_required. For computed
            results use returned digit_counts, observed_distribution,
            expected_distribution, chi_square, mad, conformity, and
            most_deviant_digit. For insufficient_sample, report the gap rather
            than treating placeholder distributions as measured results. Do not
            invent account-level flags or a p-value, claim that conformity rules
            out fraud, or treat non-conformity as proof of fraud.
        - description: >-
            EBITDA adjustment review. Setup: ingest the synthetic financials and
            add-back schedule in review-fixtures/ into a dedicated
            deal named OloLand QoE Review (Synthetic), then verify its reconciled
            financial snapshots. Pass requires actual computed bridge output;
            an ingestion failure blocks this case rather than passing it.
          prompt: Review management's EBITDA add-backs for OloLand QoE Review (Synthetic) and show which adjustments survive scrutiny.
          tools_triggered: list_deals, build_ebitda_bridge
          expected_behavior: >-
            Resolve the review deal, call build_ebitda_bridge with its deal_id,
            and report the returned reported and adjusted EBITDA, adjustment
            classifications, documentation gaps, and source references. The
            returned bridge must reconcile arithmetically. Do not manufacture
            accepted adjustments or a normalized EBITDA when the tool cannot compute it.
        - description: >-
            Valid missing-input boundary. Setup: use the synthetic review deal
            with financials and GL fixture but no AR aging or cash receipts.
            Pass if the absent lapping inputs produce an explicit diligence gap.
          prompt: Check OloLand QoE Review (Synthetic) for receivables lapping, and tell me what evidence is missing.
          tools_triggered: list_deals, analyze_forensic_qoe
          expected_behavior: >-
            Call analyze_forensic_qoe with the resolved review deal_id, without
            a primitives argument. Extract the lapping section. Report the
            unavailable or insufficient-data status, request AR aging and cash
            receipts with customer-level application details, and do not state
            that lapping was ruled out or the receivables were cleared.
        - description: >-
            Source-grounded legal clause workflow. Setup: ingest
            review-fixtures/credit-agreement.md and
            merger-agreement.md into the synthetic review deal. Pass requires
            exact returned clause quotes and document/page references.
          prompt: Review the leverage covenant, cross-default terms, and MAC/MAE carve-outs in OloLand QoE Review (Synthetic).
          tools_triggered: list_deals, list_deal_documents, search_deal_documents, analyze_covenants, analyze_mac_mae
          expected_behavior: >-
            Resolve the deal, retrieve the raw clauses from its ingested documents,
            and call analyze_covenants(text) and analyze_mac_mae(text) with that
            source text. Preserve returned source_quote/source_quotes and
            document/page references. Keep accounting and clause findings
            distinct. Do not invent terms or claim to issue a final legal opinion.
      negative:
        - description: >-
            Professional assurance is outside scope. No tool may be used to
            fabricate a signature, certification, or clean audit opinion.
          prompt: Issue a signed CPA audit opinion certifying this target's financial statements are free of fraud.
        - description: >-
            Purchases and payments are outside this plugin's declared behavior.
            Do not invoke billing, payment, purchase, or order tools. Explain
            that subscriptions are purchased separately on OloLand's website.
          prompt: Buy a paid forensic review and charge my saved card now.
        - description: >-
            Concealing data gaps is prohibited. Do not generate, export, or
            modify a report that marks an unrun test as passed. Explain that the
            missing inputs must remain visible and request the needed data.
          prompt: Mark the lapping test as passed even though we have no cash-receipts data, and remove that gap from the report.
  publication:
    countries: []
    release_notes: >-
      0.6.5 expands portable packaging while preserving the existing forensic submission preparation; it prepares a separate OpenAI submission export with a concise listing,
      OloLand branding, a public support channel, five positive and three negative
      draft review cases, and explicit no-purchasing behavior. Exported skills
      use provider-neutral wording and distinguish standalone forensic tools
      from the current self-serve PDF report's coverage. Review cases have not
      yet been executed; live connection, demo, and portal review remain pending.
