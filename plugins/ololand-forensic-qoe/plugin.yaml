name: ololand-forensic-qoe
version: 0.6.5
displayName: OloLand Forensic QoE
category: Productivity
description: >-
  Forensic Quality-of-Earnings primitives as a standalone Claude plugin:
  Beneish M-Score, Benford's Law, EBITDA bridge, journal-entry testing, lapping
  detection, working-capital deep dive, and sourced covenant, cross-default,
  and MAC/MAE clause analysis.
  Wraps OloLand's deterministic forensic
  engines as the Pre-LOI Forensic Screen and Full QoE reports — included
  in OloLand Pro and above. Positioned against Big-4 QoE
  ($150-500K, 4-8 weeks).
marketplaceDescription: >-
  Forensic Quality-of-Earnings primitives as a standalone plugin: Beneish
  M-Score, Benford's Law, EBITDA bridge, journal-entry testing, lapping
  detection, working-capital deep dive, and sourced covenant, cross-default,
  and MAC/MAE clause analysis.
  The Pre-LOI Forensic Screen — IC-defensible,
  included in Pro and above along with the Full QoE report, vs Big-4 QoE at
  $150-500K / 4-8 weeks.
shortDescription: Forensic earnings analysis
longDescription: >-
  Forensic quality-of-earnings workflows for private-equity and M&A analysts.
  Connect your OloLand account to run available deterministic forensic tools,
  inspect data gaps, review management EBITDA adjustments, verify draft figures
  against ingested deal documents, and examine sourced covenant and MAC/MAE clauses.
  Supported individual tool workflows include Beneish, Benford, EBITDA bridge,
  journal-entry testing, and lapping detection when the current MCP server and
  required inputs support them. Preserve each tool's evidence, methodology,
  returned status, and limitations; statistical flags require investigation.
  The self-serve Full QoE PDF report has narrower coverage: eligible Benford,
  lapping, and journal-entry tests. It does not currently include Beneish,
  EBITDA bridge, full cross-document reconciliation, working-capital normalization,
  or revenue-quality deep dives. This plugin does not issue a signed CPA opinion
  or complete professional diligence. Access depends on your OloLand account,
  subscription, workspace permissions, and available deal data. Subscriptions
  are purchased separately on OloLand's website; this plugin does not purchase
  services or initiate payments.
developerName: Ololand.ai Inc
homepage: https://ololand.ai/qoe
repository: https://github.com/ololand-ai/ololand-plugins
license: Apache-2.0
